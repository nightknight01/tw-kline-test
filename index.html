<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="K線測試">
  <meta name="format-detection" content="telephone=no">
  <title>型態雷達 K線測試</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="row">
      <div class="brand">
        <h1>型態雷達 · <span>K線測試</span></h1>
        <p class="hint">雙指縮放 · 單指滑動 · 點一下看開高低收</p>
      </div>
      <div class="controls">
        <div class="toggle" role="group" aria-label="商品切換">
          <button type="button" id="btn-taiex" aria-pressed="true">加權指數</button>
          <button type="button" id="btn-2330" aria-pressed="false">2330 台積電</button>
        </div>
        <button type="button" class="reset" id="btn-reset">重設縮放</button>
      </div>
    </div>
    <div class="legend" id="legend">
      <div class="date" id="leg-date">載入中…</div>
      <div class="ohlcv" id="leg-ohlcv"></div>
    </div>
  </header>
  <div id="chart"><div class="status" id="status">正在載入圖表…</div></div>
  <footer class="footer" id="footer"></footer>
  <script src="lightweight-charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
